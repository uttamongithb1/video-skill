<style>
:root {
  /* Colors */
  --maroon: rgb(108, 0, 19);
  --maroon-dark: rgb(60, 0, 12);
  --cream: rgb(255, 248, 240);
  --lavender: rgb(235, 230, 240);
  --ink: rgb(15, 12, 20);
  --ink-soft: rgb(80, 70, 90);
  --gold: rgb(255, 215, 0);
  --gold-soft: rgba(255, 215, 0, 0.15);
  --cyan: rgb(90, 200, 255);
  --cyan-soft: rgba(90, 200, 255, 0.1);
  --emerald: rgb(60, 200, 140);
  --glass-bg: rgba(255, 255, 255, 0.65);
  --glass-dark: rgba(108, 0, 19, 0.7);
  --glass-border: rgba(255, 255, 255, 0.4);
  --shadow-soft: 0 8px 32px rgba(0,0,0,0.12);
  --shadow-hard: 0 20px 60px rgba(108, 0, 19, 0.25);

  /* Motion */
  --ease-premium: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-bounce: cubic-bezier(0.68, -0.55, 0.27, 1.55);
  --ease-snap: cubic-bezier(0.4, 0, 1, 1);
  --fade-in: 0.5s;
  --slide-in: 0.7s;
  --pop-in: 0.45s;
  --ken-burns: 8s;
  --transition-wipe: 0.5s;
  --transition-blur: 0.6s;
  --stagger: 0.12s;

  /* Typography */
  --font-stack: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  --font-display: 'Inter var', -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;

  /* Layout */
  --canvas-w: 1280px;
  --canvas-h: 720px;
  --page-padding: 100px;
  --safe-x: 160px;
  --safe-y: 140px;
  --max-text-width: 960px;
}

* {{ margin: 0; padding: 0; box-sizing: border-box; }}

#root {{
  width: var(--canvas-w);
  height: var(--canvas-h);
  position: relative;
  overflow: hidden;
  font-family: var(--font-display);
  color: var(--cream);
  background: var(--maroon);
}}

/* Safe zone guide (not rendered, just for reference in preview) */
.safe-zone {{
  position: absolute;
  top: var(--safe-y); left: var(--safe-x);
  right: var(--safe-x); bottom: var(--safe-y);
  border: 2px dashed rgba(255,255,255,0.15);
  pointer-events: none;
  z-index: 0;
}}

.scene {{
  width: 100%; height: 100%; position: absolute; top: 0; left: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: var(--page-padding);
  z-index: 1;
}}

.text-safe {{
  max-width: var(--max-text-width);
  text-align: center;
}}

/* Premium utility classes */
.glass-card {{
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  box-shadow: var(--shadow-soft);
}}

.glass-dark-card {{
  background: var(--glass-dark);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  box-shadow: var(--shadow-hard);
}}

.gradient-text {{
  background: linear-gradient(135deg, var(--cream) 0%, var(--gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}}

.gold-accent {{
  color: var(--gold);
}}

/* Kinetic typography animations */
@keyframes popIn {{
  0% {{ opacity: 0; transform: scale(0.6) rotate(-2deg); }}
  60% {{ transform: scale(1.1) rotate(1deg); }}
  100% {{ opacity: 1; transform: scale(1) rotate(0); }}
}}

@keyframes slideInLeft {{
  0% {{ opacity: 0; transform: translateX(-40px); }}
  100% {{ opacity: 1; transform: translateX(0); }}
}}

@keyframes slideInRight {{
  0% {{ opacity: 0; transform: translateX(40px); }}
  100% {{ opacity: 1; transform: translateX(0); }}
}}

@keyframes scaleReveal {{
  0% {{ opacity: 0; transform: scale(0.85); }}
  100% {{ opacity: 1; transform: scale(1); }}
}}

@keyframes slideUp {{
  0% {{ opacity: 0; transform: translateY(30px); }}
  100% {{ opacity: 1; transform: translateY(0); }}
}}

@keyframes kenBurns {{
  0% {{ transform: scale(1) translate(0, 0); }}
  100% {{ transform: scale(1.12) translate(20px, -10px); }}
}}

@keyframes motionBlurWipe {{
  0% {{ clip-path: inset(0 100% 0 0); }}
  100% {{ clip-path: inset(0 0 0 0); }}
}}

.word-kinetic {{
  display: inline-block;
  opacity: 0;
  animation: popIn var(--pop-in) var(--ease-premium) forwards;
}}

.word-slide-l {{
  display: inline-block;
  opacity: 0;
  animation: slideInLeft var(--slide-in) var(--ease-premium) forwards;
}}

.word-slide-r {{
  display: inline-block;
  opacity: 0;
  animation: slideInRight var(--slide-in) var(--ease-premium) forwards;
}}

.scene-ken-burns {{
  animation: kenBurns var(--ken-burns) var(--ease-premium) alternate infinite;
}}

.transition-wipe {{
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 100;
  animation: motionBlurWipe var(--transition-wipe) var(--ease-premium) forwards;
}}
</style>
</head>
